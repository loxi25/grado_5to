<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>¡Hola!</h2>
    <p>Prueba el botón</p>

    <h1 id="contador">0</h1>

    <button onclick="contar()">Presionar</button>

    <script>
        let numero = 0;

        function contar() {
            numero = numero + 1;
            document.getElementById("contador").innerHTML = numero;
        }
    </script>


<button>P</button>

</body>
</html>
